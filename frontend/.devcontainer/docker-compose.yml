version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ../..:/workspaces:cached
    command: sleep infinity
    ports:
      - '3000:3000'
    environment:
      - NODE_ENV=development
    networks:
      - service:db

networks:
  service:db:
    driver: bridge
